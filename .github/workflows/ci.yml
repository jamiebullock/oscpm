name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; a push to develop
# is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            preset: release
            configure_args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux (Clang)
            os: ubuntu-latest
            preset: release
            configure_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Linux (GCC, Debug)
            os: ubuntu-latest
            preset: debug
            configure_args: -DCMAKE_CXX_COMPILER=g++
          - name: macOS
            os: macos-latest
            preset: release
            configure_args: ''
          - name: Windows (MSVC)
            os: windows-latest
            preset: release
            configure_args: ''
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The version comes from the tags; a default checkout has none.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Puts cl.exe on the PATH for Ninja, whichever Visual Studio the image
      # carries.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DOSCPM_CHECK_FORMAT=OFF -DOSCPM_BUILD_BENCHMARKS=ON ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Check the test suite and the benchmarks are registered
        shell: bash
        run: |
          ctest --preset ${{ matrix.preset }} -N | grep -E 'Total Tests: [1-9]'
          ctest --preset ${{ matrix.preset }} -N -L bench | grep -E 'Total Tests: [1-9]'

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # clang-format's output changes between releases; the tree is formatted
      # with this one.
      - name: Install clang-format
        run: pip install clang-format==22.1.0

      - name: Check formatting
        run: |
          git ls-files 'include/*.h' 'tests/*.h' 'tests/*.cpp' 'fuzz/*.cpp' 'examples/*.cpp' 'bench/*.h' 'bench/*.cpp' | xargs clang-format --style=file --dry-run --Werror

  fuzz:
    name: Fuzz under ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Ninja and an LLVM clang with libFuzzer
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-dev

      - name: Configure
        run: cmake --preset release -DCMAKE_CXX_COMPILER=clang++ -DOSCPM_BUILD_FUZZERS=ON -DOSCPM_SANITIZE=ON -DOSCPM_CHECK_FORMAT=OFF

      # Naming the fuzz target fails the build if the libFuzzer probe skipped it.
      - name: Build the tests, the example and the fuzz target
        run: cmake --build --preset release --target oscpm_tests oscpm_visitor_rule oscpm_dispatch oscpm_pattern_fuzz

      - name: Run the tests under the sanitizers and every seed once
        run: ctest --preset release

      - name: Fuzz for one minute
        run: build/release/fuzz/oscpm_pattern_fuzz -max_total_time=60 -max_len=16384 -print_final_stats=1 build/release/fuzz/corpus build/release/fuzz/seeds

      - name: Keep any finding
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
            build/release/fuzz/crash-*
            build/release/fuzz/leak-*
            build/release/fuzz/timeout-*
            build/release/fuzz/oom-*
          if-no-files-found: ignore

  mutation:
    name: Mutation tests (Mull)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The package is built against the clang-18 that ubuntu-24.04 carries;
      # the mutation preset names both.
      - name: Install Ninja, clang-18 and Mull
        run: |
          curl -sSL --fail -o mull.deb https://github.com/mull-project/mull/releases/download/0.34.1/Mull-18-0.34.1-LLVM-18.1.3-ubuntu-amd64-24.04.deb
          echo "983ea9c84ecab621414d5442a66c1a1ce4127491b79d42fd5e2fd6fe01d02699  mull.deb" | sha256sum --check
          sudo apt-get update && sudo apt-get install -y ninja-build clang-18 ./mull.deb

      - name: Configure
        run: cmake --preset mutation

      - name: Build the tests with the Mull plugin and run them once per mutant
        run: cmake --build --preset mutation

      - name: Keep the mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            build/mutation/reports/mutation.json
            build/mutation/reports/mutation.txt
          if-no-files-found: ignore
