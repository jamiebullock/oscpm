name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share a group, so a new push cancels the superseded
# one. A push to develop gets a group of its own and is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            preset: release
            configure_args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux (Clang)
            os: ubuntu-latest
            preset: release
            configure_args: -DCMAKE_CXX_COMPILER=clang++
          - name: macOS
            os: macos-latest
            preset: release
            configure_args: ''
          - name: Windows (MSVC)
            os: windows-latest
            preset: release
            configure_args: ''
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The version comes from the most recent tag, and checkout fetches
          # none by default: without this every build reports 0.0.0.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Ninja needs cl.exe on the PATH, which only a Visual Studio developer
      # environment arranges. The job uses the Ninja preset so it does not
      # depend on which Visual Studio release the runner image carries.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64

      # Formatting is checked by the job below with a pinned clang-format;
      # the runners' own versions differ from it and from each other.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DOSCPM_CHECK_FORMAT=OFF ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # ctest reports success having run nothing when no test is registered.
      - name: Check the test suite is registered
        shell: bash
        run: |
          ctest --preset ${{ matrix.preset }} -N | grep -E 'Total Tests: [1-9]'

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Pinned to the version the tree is formatted with; clang-format's
      # output changes between releases, so a local check must use the same.
      - name: Install clang-format
        run: pip install clang-format==22.1.0

      - name: Check formatting
        run: |
          git ls-files 'include/*.h' 'tests/*.h' 'tests/*.cpp' | xargs clang-format --style=file --dry-run --Werror
