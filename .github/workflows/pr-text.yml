name: PR text

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-text:
    name: Check the title and description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-vale

      - name: Check the title and description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          vale sync
          mkdir "$RUNNER_TEMP/pr"
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/pr/COMMIT_EDITMSG"
          printf '%s\n' "$BODY" | tr -d '\r' \
            | awk -f .github/scripts/strip-release-notes.awk \
            > "$RUNNER_TEMP/pr/PR_BODY.md"
          vale --no-wrap "$RUNNER_TEMP/pr/COMMIT_EDITMSG" "$RUNNER_TEMP/pr/PR_BODY.md"
