name: Tag on develop

# Every push to develop is tagged; the tag is the only place the version is
# written down. Each push moves the patch, and a minor or major only when a
# commit subject since the last tag says (MINOR) or (MAJOR).

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: tag-on-develop
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and push version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # The token is used by the push step alone, so the version step's
          # action cannot read it from the workspace.
          persist-credentials: false

      - name: Determine version
        id: version
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"
          # Literal: the parentheses are part of the marker, so prose that
          # mentions a major version cannot trigger one.
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          search_commit_body: false

      - name: Tag and push version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.version_tag }}"
          echo "Tag to create: $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING="$(git rev-list -n 1 "$TAG")"
            if [ "$EXISTING" = "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points at this commit."
              exit 0
            fi
            echo "Tag $TAG already exists and points at $EXISTING, not $GITHUB_SHA."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$TAG"
