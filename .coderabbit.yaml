# CodeRabbit review settings. See https://docs.coderabbit.ai/guides/configure-coderabbit
language: en-GB

reviews:
  # Substantive findings over style notes.
  profile: chill
  high_level_summary: true
  poem: false
  # CodeRabbit requests changes when it finds something and approves once
  # that is resolved, so the review state says whether anything is open.
  request_changes_workflow: true
  # Nothing to say on a pull request with no reviewable change.
  review_status: false
  path_instructions:
    - path: '**/*.cpp'
      instructions: |
        A .cpp file carries no comments. The bar is a hidden constraint that
        no rename, refactor or test name could carry, and it is almost never
        met - flag a comment that restates what the code already says.

        Contracts are documented on the header instead, where the declaration
        is.
    - path: 'CHANGELOG.md'
      instructions: |
        The rules are in the Changelog section of CONTRIBUTING.md, and the
        check-changelog target enforces the format, so do not comment on
        the format.

        Check each entry against the code and the pull request it cites.
        When an entry is inaccurate, ask for it to be corrected or narrowed
        within one line. Do not ask for exceptions, qualifications or
        explanations to be added to an entry.

        Flag an entry that gives a reason, a mechanism or a measurement, one
        that restates a contract the header documents, and one that records
        a change no user of the library can observe (CI, tests, tooling,
        documentation, refactoring).
  # The project keeps comments to header contracts and none in .cpp files,
  # so a docstring coverage threshold would fail every pull request.
  pre_merge_checks:
    docstrings:
      mode: off
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - develop

# The changelog rules are in CONTRIBUTING.md.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'CONTRIBUTING.md'

chat:
  auto_reply: true
