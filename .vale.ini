StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/jamiebullock/vale-style/releases/download/v0.1.0/vale-style.zip
Vocab = oscpm

[formats]
h = cpp
ino = cpp

[*.md]
Plain.Flourish = warning
Plain.Spelling = warning

[*.{h,cpp}]
oscpm.Project = YES
Plain.Spelling = warning
Comments.LineComment = NO

[*.ino]
BasedOnStyles = Plain, Comments, Licence
View = C
oscpm.Project = YES
Comments.LineComment = NO
Licence.Hash = NO

[{*CMakeLists.txt,*.cmake,*.py}]
oscpm.Project = YES
